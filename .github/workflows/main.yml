name: Cypress Tests with Mochawesome (Multi-Browser)

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge, electron]

    name: Run on ${{ matrix.browser }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          install-command: npm ci
          browser: ${{ matrix.browser }}
          config-file: cypress.config.js
          spec: cypress/e2e/executionFlow.cy.js

      - name: Generate Mochawesome HTML report
        if: always()
        run: |
          mkdir -p cypress/reports/html
          npx mochawesome-merge "cypress/reports/mochawesome-report/*.json" > cypress/reports/merged-${{ matrix.browser }}.json
          npx marge cypress/reports/merged-${{ matrix.browser }}.json --reportDir cypress/reports/html --reportFilename report-${{ matrix.browser }}

      - name: Upload Mochawesome report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report-${{ matrix.browser }}
          path: cypress/reports/html
          if-no-files-found: warn

      - name: Upload screenshots and videos (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-media-${{ matrix.browser }}
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
